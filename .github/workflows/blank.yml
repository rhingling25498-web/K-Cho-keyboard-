
name: Build K'Cho Keyboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract and Build APK
        run: |
          set -e

          for file in $(find . -maxdepth 2 -iname "*.zip"); do
            echo "Extracting $file"
            unzip -o "$file" -d extracted
          done

          WRAPPER=$(find . -type f -name gradlew -not -path './.git/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found. Please upload the complete Android project ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          chmod +x "$WRAPPER"

          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KChoKeyboard-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
